services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inka
      POSTGRES_USER: inka
      POSTGRES_PASSWORD: inka_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inka -d inka"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      DATABASE_URL: jdbc:postgresql://db:5432/inka
      DATABASE_USERNAME: inka
      DATABASE_PASSWORD: inka_password
      JWT_SECRET: change-this-to-a-random-32-byte-or-longer-secret
      JWT_EXPIRATION_MS: 86400000
      APP_FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      GOOGLE_OAUTH_CLIENT_ID: change-me
      GOOGLE_OAUTH_CLIENT_SECRET: change-me
      GOOGLE_OAUTH_REDIRECT_URI: http://localhost:8080/login/oauth2/code/google
      CLOUDINARY_CLOUD_NAME: change-me
      CLOUDINARY_API_KEY: change-me
      CLOUDINARY_API_SECRET: change-me
      STRIPE_SECRET_KEY: sk_test_change_me
      STRIPE_WEBHOOK_SECRET: whsec_change_me
      STRIPE_SUCCESS_URL: http://localhost:3000/payment/success
      STRIPE_CANCEL_URL: http://localhost:3000/payment/cancel
    ports:
      - "8080:8080"

volumes:
  postgres_data:
