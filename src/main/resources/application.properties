spring.application.name=inka_backend
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

# Common persistence defaults. Profile-specific files provide datasource settings.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# SQL init disabled for normal runs so admin deletions persist.
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend-url},http://localhost:3000}

jwt.secret=${JWT_SECRET:dev-secret-change-me-dev-secret-change-me}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Google OAuth2 credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:dev-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:dev-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:{baseUrl}/login/oauth2/code/{registrationId}}

# Cloudinary credentials
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dev-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:dev-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dev-api-secret}

# Stripe
stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}
stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success}
stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancel}
